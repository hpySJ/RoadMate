name: roadmate-ai tests
on:
  pull_request:
    paths: ["roadmate-ai/**", ".github/workflows/roadmate-ai.yml"]
  push:
    branches: [main, feat/roadmate-ai-server, 'codex/**']
    paths: ["roadmate-ai/**", ".github/workflows/roadmate-ai.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: roadmate-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.lock.txt
      - run: python scripts/verify_mvp.py --local
